 const s=cont?store.get('tlt_save',null):null;if(s){inv=s.inv||{keys:1};P.x=s.p[0];P.z=s.p[1];P.yaw=s.p[2];obj=s.obj}else{inv={keys:1};Object.assign(P,{x:-129,z:12,yaw:-Math.PI/2,pitch:0});obj=0}
 P.y=P.ground=groundAt(P.x,P.z);P.vy=0;$('arrow').style.display='none';setObj(obj);buildInv()}
function pauseGame(){if(state!=='play')return;state='pause';save();show('pause');if(AU.ctx)AU.ctx.suspend()}
function resumeGame(){hidePanels();state='play';uiOpen=false;if(AU.ctx)AU.ctx.resume()}
function toMenu(){state='menu';$('hud').style.display='none';show('menu');$('mCont').disabled=!store.get('tlt_save',null);beam.visible=false;if(AU.ctx)AU.ctx.resume()}
let setsFrom='menu';
function openSets(from){setsFrom=from;$('sVol').value=Math.round(settings.vol*100);$('sQ').textContent=QL[settings.q].n;show('sets')}
$('mNew').onclick=()=>startGame(false);$('mCont').onclick=()=>startGame(true);$('mSet').onclick=()=>openSets('menu');$('mFs').onclick=toggleFS;
$('pRes').onclick=resumeGame;$('pSet').onclick=()=>openSets('pause');$('pMenu').onclick=toMenu;
$('sBack').onclick=()=>show(setsFrom);$('sVol').oninput=e=>setVol(e.target.value/100);
$('sQ').onclick=()=>{settings.q=(settings.q+1)%QL.length;store.set('tlt_set',settings);$('sQ').textContent=QL[settings.q].n;applyQuality()};
$('bPause').onclick=pauseGame;$('bInv').onclick=()=>{if(state!=='play'||uiOpen)return;uiOpen=true;buildInv();show('invp')};
$('iClose').onclick=()=>{hidePanels();uiOpen=false};$('rClose').onclick=()=>{hidePanels();uiOpen=false};
$('bFs').onclick=toggleFS;
function toggleFS(){const e=document.documentElement;const done=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(x){}};
 try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
 else{const f=e.requestFullscreen||e.webkitRequestFullscreen;if(f){const p=f.call(e);if(p&&p.then)p.then(done).catch(()=>fsMsg())}else fsMsg()}}catch(x){fsMsg()}}
function fsMsg(){showTip('Полный экран здесь недоступен. Откройте игру в браузере; на iPhone: «Поделиться» → «На экран Домой».')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
/* ---------- ввод (pointer events, мультитач) ---------- */
const pad=$('pad'),joy=$('joy'),kn=$('kn');let look=null,jid=null,sens=1;
pad.addEventListener('pointerdown',e=>{if(look)return;look={id:e.pointerId,x:e.clientX,y:e.clientY};try{pad.setPointerCapture(e.pointerId)}catch(x){}});
pad.addEventListener('pointermove',e=>{if(!look||e.pointerId!==look.id||state!=='play'||uiOpen)return;P.yaw-=(e.clientX-look.x)*.0042*sens;P.pitch=clamp(P.pitch-(e.clientY-look.y)*.0042*sens,-1.3,1.3);look.x=e.clientX;look.y=e.clientY});
const lEnd=e=>{if(look&&e.pointerId===look.id)look=null};pad.addEventListener('pointerup',lEnd);pad.addEventListener('pointercancel',lEnd);
function jm(e){const q=joy.getBoundingClientRect(),m=q.width/2-12;let dx=e.clientX-q.left-q.width/2,dy=e.clientY-q.top-q.height/2;const l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=-dy/m;kn.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();jid=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(x){}jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const jEnd=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;kn.style.transform=''}};joy.addEventListener('pointerup',jEnd);joy.addEventListener('pointercancel',jEnd);
function hold(el,on,off){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.classList.add('on');on()});['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,()=>{if(el.classList.contains('on')){el.classList.remove('on');off&&off()}}))}
hold($('bR'),()=>run=true,()=>run=false);hold($('bJ'),()=>jumpReq=true);hold($('bI'),interact);
['bInv','bPause','bFs'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')interact();if(e.code==='KeyI')$('bInv').onclick();if(e.code==='Escape'){if(state==='play'&&!uiOpen)pauseGame();else if(uiOpen){hidePanels();uiOpen=false}}if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
/* ---------- цикл ---------- */
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);
 if(state==='play'){update(dt);const bob=Math.sin(P.bob)*.035;cam.position.set(P.x,P.y+1.68+bob,P.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ');updateCars(dt)}
 else{menuT+=dt*.08;cam.position.set(Math.cos(menuT)*70,22,Math.sin(menuT)*70);cam.lookAt(0,8,0);updateCars(dt)}
 const px=cam.position.x,pz=cam.position.z;sun.target.position.set(Math.round(px/4)*4,0,Math.round(pz/4)*4);sun.position.set(sun.target.position.x-60,95,sun.target.position.z+45);
 scene.getObjectByName('sky').position.copy(cam.position);
 if(AU.carGain){let dmin=999;movers.forEach((m,k)=>{const b=carBox[parked+k];dmin=Math.min(dmin,Math.hypot((b[0]+b[2])/2-px,(b[1]+b[3])/2-pz))});AU.carGain.gain.value=.4+Math.max(0,1-dmin/40)*.5}
 renderer.render(scene,cam)}
applyQuality();resize();$('mCont').disabled=!store.get('tlt_save',null);$('loadT').textContent='Готово. Нажмите «Новая игра».';frame();
</script></body></html>
